<!DOCTYPE html SYSTEM "about:legacy-compat" [ <!ENTITY times "&#xD7;">
]>
<html lang="en" xmlns:z="http://www.hekkelman.com/libzeep/m2" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

<body>

	<!-- The gene selection dialog: -->
	<div z:fragment="gene-selection-dialog(screenType)">
		<script z:src="@{/dist/gene-selection.js}" src="/scripts/gene-selection.js"></script>

		<button class="btn btn-sm btn-secondary show-gene-selection-btn" id="show-gene-selection-btn"
			data-bs-toggle="modal" data-bs-target="#gene-selection-dialog">Select Genes</button>

		<div class="modal fade" tabindex="-1" role="dialog" aria-labelledby="dialog-label" id="gene-selection-dialog">
			<div class="modal-dialog" role="document">
				<div class="modal-content">
					<div class="modal-header">
						<h5 class="modal-title" id="dialog-label">Gene selection editor</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>
					<div class="modal-body">
						<div z:fragment="geneselection">
							<h6>gene selection</h6>
							<form name="geneSelectionForm">
								<ul class="option-group">
									<li>
										<div class="input-group input-group-sm mb-3">
											<label class="input-group-text" for="assembly-select"
												style="min-width: 4em;">Assembly</label>

											<select class="form-select form-select-sm" name="assembly"
												id="assembly-select">
												<option value="hg19">HG19</option>
												<option value="hg38" selected="selected">HG38</option>
											</select>
										</div>

										<div class="input-group input-group-sm mb-3">
											<label class="input-group-text" for="transcripts-select"
												style="min-width: 4em;">Transcript</label>

											<select class="form-select form-select-sm" name="transcripts"
												id="transcripts-select">
												<option value="default">Default</option>
												<option z:each="transcript: ${transcripts}" z:value="${transcript.id}"
													z:text="${transcript.name}"></option>
											</select>
										</div>

										<div class="input-group input-group-sm mb-3">
											<label class="input-group-text" for="mode-select">Mode</label>

											<select class="form-select form-select-sm" name="mode" id="mode-select">
												<option value="collapse" z:selected="${screenType=='ip'}">Collapse
												</option>
												<option value="longest-transcript"
													z:selected="${screenType=='pa' or screenType=='sl'}">Longest
													Transcript</option>
												<option value="longest-exon">Longest Exon</option>
											</select>
										</div>

										<div class="input-group input-group-sm mb-3">
											<span class="input-group-text">
												<input type="checkbox" name="cut-overlap"
													z:checked="${screenType=='ip'}" />
											</span>
											<input type="text" class="form-control form-control-sm"
												value="Remove overlapped regions" />
										</div>

										<div class="input-group input-group-sm mb-3">
											<label class="input-group-text" id="StartLabel" for="geneStartType"
												style="min-width: 4em;">Start</label>

											<select class="form-select form-select-sm" id="geneStartType">
												<option value="txStart" selected="selected">tx-start</option>
												<option value="txEnd">tx-end</option>
												<option value="cdsStart">cds-start</option>
												<option value="cdsEnd">cds-end</option>
											</select>

											<input type="text" class="form-control" aria-label="Start of gene"
												aria-describedby="StartLabel" id="geneStartOffset"
												placeholder="offset..." z:value="${screenType=='pa'?-5000:''}" />
										</div>

										<div class="input-group input-group-sm mb-3">
											<label class="input-group-text" id="EndLabel" for="geneEndType"
												style="min-width: 4em;">End</label>

											<select class="form-select form-select-sm" id="geneEndType">
												<option value="txStart">tx-start</option>
												<option value="txEnd">tx-end</option>
												<option value="cdsStart" z:selected="${screenType=='pa'}">cds-start
												</option>
												<option value="cdsEnd" z:selected="${screenType!='pa'}">cds-end</option>
											</select>

											<input type="text" class="form-control" aria-label="End of gene"
												aria-describedby="EndLabel" id="geneEndOffset"
												placeholder="offset..." />
										</div>

										<div z:if="${screenType!='sl'}" class="btn-group btn-group-sm" role="group"
											id="directionBtns">
											<input type="radio" class="btn-check" name="direction" autocomplete="off"
												value="sense" checked="checked" id="btn-dir-sense" />
											<label for="btn-dir-sense" class="btn btn-secondary active">Sense</label>

											<input type="radio" class="btn-check" name="direction" value="antisense"
												autocomplete="off" id="btn-dir-antisense" />
											<label for="btn-dir-antisense" class="btn btn-secondary">AntiSense</label>

											<input type="radio" class="btn-check" name="direction" value="both"
												autocomplete="off" id="btn-dir-both" />
											<label for="btn-dir-both" class="btn btn-secondary">Both</label>
										</div>


									</li>
								</ul>
							</form>
						</div>
					</div>
					<!-- <div class="modal-footer">
						<button type="submit" form="geneSelectionForm" class="btn btn-primary">Set</button></div> -->
				</div>
			</div>
		</div>
	</div>

</body>


</html>
