<!DOCTYPE html SYSTEM "about:legacy-compat">
<html lang="en" xmlns:z="http://www.hekkelman.com/libzeep/m2">

<head z:replace="~{head :: head(~{::title}, ~{}, ~{::script})}">

	<title>Fishtail Plot - Phenosaurus</title>

	<script src="/scripts/screen.js" type="application/ecmascript" z:src="@{/scripts/screen.js}"></script>
</head>

<body class="site">
	<nav z:replace="menu :: menu"></nav>

	<div class="container-fluid site-content">
		<div class="option-row">
			<div class="screen-selector">
				<div class="input-group input-group-sm">
					<label class="input-group-text" for="screenList">screen</label>
					<select class="form-select" id="screenList">
						<option>Choose...</option>
						<option z:each="screen: ${screens}" z:attr="data-screen=${screen.name}" z:value="${screen.name}"
							z:text="${public ? screen.published_name ?: screen.name : screen.name}"
							z:selected="${screen.name==#request.getParameter('screen')}"></option>
					</select>
				</div>
			</div>

			<div z:insert="~{gene-selection::gene-selection-dialog(screenType)}"></div>

			<div z:if="${not public}">
				<div class="input-group input-group-sm">

					<form name="graphTypeForm">
						<div class="btn-group btn-group-sm" role="group">
							<input type="radio" class="btn-check" name="graphType" autocomplete="off"
								data-type="regular" checked="checked" id="btn-type-regular" />
							<label for="btn-type-regular" class="btn btn-secondary">Regular</label>

							<input type="radio" class="btn-check" name="graphType" data-type="unique" autocomplete="off"
								id="btn-type-unique" />
							<label for="btn-type-unique" class="btn btn-secondary">Unique</label>

							<input type="radio" class="btn-check" name="graphType" data-type="total-unique"
								autocomplete="off" id="btn-type-totally-unique" />
							<label for="btn-type-totally-unique" class="btn btn-secondary">Totally Unique</label>

							<input type="radio" class="btn-check" name="graphType" data-type="low" autocomplete="off"
								id="btn-type-low" />
							<label for="btn-type-low" class="btn btn-secondary">Low</label>

							<input type="radio" class="btn-check" name="graphType" data-type="high" autocomplete="off"
								id="btn-type-high" />
							<label for="btn-type-high" class="btn btn-secondary">High</label>
						</div>
					</form>

				</div>
			</div>

			<div>
				<div class="input-group input-group-sm">
					<label class="input-group-text" for='pv-cut-off'>p-value</label>
					<input type="number" min="0" max="1" step="0.01" id="pv-cut-off" maxlength="8" size="5"
						placeholder="0.05" class="form-control" value="0.05" />
				</div>
			</div>

			<div>
				<div class="input-group input-group-sm">
					<input type="text" id="highlightGene" size="10" placeholder="Enter genename..."
						z:value="${#request.getParameter('gene')}" class="form-control form-control-sm" />

					<button type="button" class="btn btn-sm btn-outline-secondary"
						id="btn-highlight-gene">Highlight</button>
					<button type="button" class="btn btn-sm btn-outline-secondary"
						id="btn-clear-highlight">Clear</button>
				</div>
			</div>

			<div z:insert="~{gene-info::gene-info-dialog('ip')}"></div>

			<button class="btn btn-primary btn-sm" id="reload-btn">Reload</button>
		</div>

		<div class="plot-title mt-2" style="display: none;">
			<span class="loading">
				<div class="spinner-border spinner-border-sm" role="status"></div> Loading screen <span
					class="screen-name"></span>
			</span>
			<span class="loaded">Fishtail plot for <span class="screen-name"></span></span>
			<span class="failed">Fishtail plot for <span class="screen-name"></span> could not be loaded.
				<span id="plot-status-error-text"></span></span>
		</div>

		<div class="plot-container">
			<svg width="100%" height="90%" id="plot" class="fishtail"></svg>
		</div>

		<div id="genome-viewer-container">
			<!-- <svg width="100%" height="60" id="genome-viewer"></svg> -->
		</div>

		<div class="row mt-2">
			<div class="col-6">
				<h5>Negative regulators</h5>
				<table class="table table-hover table-sm" id="negative-regulators">
					<thead>
						<tr>
							<th>relgene</th>
							<th>low</th>
							<th>high</th>
							<th>fcpv</th>
							<th>log2(MI)</th>
						</tr>
					</thead>
					<tbody>
					</tbody>
				</table>
			</div>

			<div class="col-6">
				<h5>Positive regulators</h5>
				<table class="table table-hover table-sm" id="positive-regulators">
					<thead>
						<tr>
							<th>relgene</th>
							<th>low</th>
							<th>high</th>
							<th>fcpv</th>
							<th>log2(MI)</th>
						</tr>
					</thead>
					<tbody>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<footer z:replace="footer :: content"></footer>

	<div z:replace="context-menu :: contextMenuNav"></div>
	<div z:replace="context-menu :: genomeViewerContextMenuNav"></div>
</body>

</html>
