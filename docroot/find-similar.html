<!DOCTYPE html SYSTEM "about:legacy-compat">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:z2="http://www.hekkelman.com/libzeep/m2" xml:lang="en" lang="en">

<head z2:replace="~{head :: head(~{::title}, ~{}, ~{::script})}">
	<title>Find Similar - Phenosaurus</title>

	<script defer="defer" src="/scripts/find-similar.js" type="application/ecmascript"
		z2:src="@{/scripts/find-similar.js}"></script>

	<script z2:inline="javascript">
		const screenInfo = /*[[${screenInfo}]]*/ null;
		const screenType = /*[[${screenType}]]*/ null;
	</script>
</head>

<body class="site">
	<nav z2:replace="menu :: menu"></nav>

	<div class="container-fluid mt-3 site-content">

		<div class="option-row mb-3">

			<div class="option-col">
				<div class="btn-group btn-group-sm" id="graphTypeBtns" role="group">
					<input type="radio" class="btn-check" name="graphType" id="heatmap" autocomplete="off"
						checked="checked" />
					<label for="heatmap" class="btn btn-sm btn-secondary">Heatmap</label>
					<input type="radio" class="btn-check" name="graphType" id="dotplot" autocomplete="off" />
					<label for="dotplot" class="btn btn-sm btn-secondary">Dotplot</label>
				</div>
			</div>

			<div class="option-col">
				<div class="input-group input-group-sm">
					<label class="input-group-text" for='gene'>Gene</label>
					<input class="form-control" type="text" id="gene" z2:value="${#request.getParameter('gene')}" />
				</div>
			</div>

			<div class="option-col">
				<div class="input-group input-group-sm">
					<label class="input-group-text" for='pv-cut-off'>p-value filter</label>
					<input type="number" min="0" max="1" step="0.001" id="pv-cut-off" maxlength="8" size="5"
						placeholder="0.05" class="form-control" value="0.05" />
				</div>
			</div>

			<div class="option-col">
				<div class="input-group input-group-sm">
					<label class="input-group-text" for='zscore-cut-off'>z-score filter</label>
					<input type="number" min="0" max="10" step="0.1" id="zscore-cut-off" maxlength="8" size="5"
						placeholder="2" class="form-control" value="2" />
				</div>
			</div>

			<div class="option-col">
				<div class="option-col" z2:insert="~{gene-selection::gene-selection-dialog(screenType)}"></div>
			</div>

			<div class="option-col">
				<div z2:replace="~{gene-info :: gene-info-dialog('ip')}"></div>
			</div>
		</div>

		<div class="container-fluid mt-4 mb-4">
			<div class="plot-title" style="display: none;">
				<span class="loading">
					<div class="spinner-border spinner-border-sm" role="status"></div> Searching for <span
						class="gene-name"></span>
				</span>
				<span class="loaded">Query results for <span class="gene-name"></span></span>
				<span class="failed">Query results for <span class="gene-name"></span> could not be loaded.</span>
				<span class="no-hits">No hits found for <span class="gene-name"></span></span>
			</div>
		</div>

		<template id="gene-line-template">
			<tr>
				<td><input type="text" readonly="readonly" class="form-control-plaintext" /></td>
				<td><input type="text" readonly="readonly" class="form-control-plaintext" /></td>
				<td class="svg-container"></td>
				<td><a href="#"> <i class="bi bi-sort-up sort-screens"></i></a></td>
			</tr>
		</template>

		<div class="container-fluid">
			<table id="plot" cellpadding="0" cellspacing="0" class="heatmap gf-tabel no-anti">
				<thead>
					<tr>
						<th>Gene</th>
						<th>Z-score</th>
						<th></th>
						<th></th>
					</tr>
				</thead>
				<tbody>
				</tbody>
				<tbody class="divider">
					<tr>
						<td>
							<strong>Anti</strong>
						</td>
						<td colspan="3">
							<hr />
						</td>
					</tr>
				</tbody>
				<tbody class="anti">
				</tbody>
				<tfoot>
					<tr>
						<td colspan="2"></td>
						<td class="label-container"></td>
						<td></td>
					</tr>
				</tfoot>
			</table>
		</div>

		<div class="tooltip"></div>
	</div>

	<footer z2:replace="footer :: content"></footer>

</body>

</html>
