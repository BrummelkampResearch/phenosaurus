<!DOCTYPE html SYSTEM "about:legacy-compat" [
<!ENTITY nbsp "&#160;">
]>
<html lang="en" xmlns:z2="http://www.hekkelman.com/libzeep/m2" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

<head z2:replace="head :: head(~{::title}, ~{}, ~{::script})">
	<title>Compare 3 - Phenosaurus</title>
	<script src="/scripts/compare-screens.js" type="application/ecmascript" z2:src="@{/dist/compare-screens.js}"></script>
</head>

<body>
	<nav z2:replace="~{menu :: menu}"></nav>

	<div class="container-fluid mt-3">
		<div class="option-row">
			<div class="option-col">
				<div class="input-group input-group-sm">
					<label class="input-group-text" for='pv-cut-off'>p-value</label>
					<input type="number" min="0" max="1" step="0.001" id="pv-cut-off" maxlength="8" size="5"
							placeholder="0.05"
							class="form-control" value="0.05"/>
				</div>
			</div>

			<div class="option-col">

				<div class="btn-group btn-group-sm" id="graphColorBtns">
					<input type="radio" name="graphColor" id="gradient" autocomplete="off" data-colortype="gradient" class="graph-color-btn" checked="checked" />
					<label for="gradient" class="btn btn-secondary">Gradient</label>
					<input type="radio" name="graphColor" id="unique" autocomplete="off" data-colortype="unique" class="graph-color-btn" />
					<label for="unique" class="btn btn-secondary">Unique</label>
				</div>

			</div>

			<div class="option-col">
				<div class="input-group input-group-sm">
					<input type="text" id="highlightGene" size="10"
						placeholder="Enter genename..."
						z2:value="${#request.getParameter('gene')}"
						class="form-control form-control-sm"/>

					<button type="button" class="btn btn-sm btn-outline-secondary" id="btn-highlight-gene">Highlight</button>
					<button type="button" class="btn btn-sm btn-outline-secondary" id="btn-clear-highlight">Clear</button>
				</div>	
			</div>
			
			<div class="option-col" z2:insert="~{gene-selection::gene-selection-dialog(screenType)}"></div>

			<div class="option-col">
				<div z2:replace="gene-info :: gene-info-dialog('ip')"></div>
			</div>

		</div>

		<div class="row">
			<div class="col">
				<div class="row">
					<div class="col"><select data-placeholder="Choose a Screen..." id="select-screen-1">
							<option value=""></option>
							<option z2:each="screen: ${screens}" z2:attr="data-screen=${screen.name}"
								z2:text="${screen.name}"></option>
						</select>
						<div class="plot-container"><svg width="100%" height="100%" id="plot-1"></svg></div>
					</div>
					<div class="col"><select data-placeholder="Choose a Screen..." id="select-screen-2">
							<option value=""></option>
							<option z2:each="screen: ${screens}" z2:attr="data-screen=${screen.name}"
								z2:text="${screen.name}"></option>
							<option z2:each="screen: ${pa-screens}" z2:attr="data-screen=${screen.name}"
								z2:text="${screen.name}"></option>
						</select>
						<div class="plot-container"><svg width="100%" height="100%" id="plot-2"></svg></div>
					</div>
				</div>
			</div>
		</div>
	</div>
	<div z2:replace="~{context-menu :: contextMenuNav}"></div>
	<footer z2:replace="~{footer :: content}"></footer>
</body>

</html>
