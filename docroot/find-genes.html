<!DOCTYPE html SYSTEM "about:legacy-compat">
<html lang="en" xmlns:z="http://www.hekkelman.com/libzeep/m2" xmlns="http://www.w3.org/1999/xhtml" xml:lang="en">

<head z:replace="~{head :: head(~{::title}, ~{}, ~{::script})}">
	<title>Gene Finder - Phenosaurus</title>

	<script src="/scripts/find-gene.js" type="application/ecmascript" z:src="@{/dist/find-gene.js}"
		defer="defer"></script>

	<script z:inline="javascript">
		const screenInfo = /*[[${screenInfo}]]*/ null;
		const screenType = /*[[${screenType}]]*/ null;
	</script>
</head>

<body class="site">
	<nav z:replace="~{menu :: menu}"></nav>

	<div class="container-fluid site-content">
		<div class="missing-genes alert alert-warning alert-dismissible" z:if="${missing}">
			<button type="button" class="close" data-dismiss="alert">&times;</button>
			<strong>Warning</strong> The following gene<span z:if="${missing.size() &gt; 1}">s</span> could not be
			found:
			<span z:each="gene, i: ${missing}"><span z:text="${gene + (i.last ? '.' : ', ')}" z:remove="tag">.</span>
			</span>
		</div>

		<div class="option-row">
			<div z:if="${screenType != 'sl'}">
				<div class="btn-group btn-group-sm" id="graphTypeBtns" role="group">
					<input type="radio" class="btn-check" name="graphType" id="heatmap" autocomplete="off"
						checked="checked" />
					<label for="heatmap" class="btn btn-secondary">Heatmap</label>
					<input type="radio" class="btn-check" name="graphType" id="dotplot" autocomplete="off" />
					<label for="dotplot" class="btn btn-secondary">Dotplot</label>
				</div>
			</div>

			<div z:insert="~{gene-selection::gene-selection-dialog(screenType)}"></div>

			<button class="btn btn-primary btn-sm" id="reload-btn">Reload</button>
		</div>

		<template id="gene-row-template">
			<tr>
				<td><input type="text" /></td>
				<td class="screen-status">
					<div class="swatch"></div>
				</td>
				<td class="svg-container no-fishtail"></td>
				<td class="no-fishtail"><a href="#"><i class="bi bi-sort-up sort-screens"></i></a>
				</td>
			</tr>
		</template>

		<div class="row mt-5">
			<div class="col">
				<ul id="controls">
					<li><a href="#" id="add-gene-line"><i class="bi bi-plus"></i></a></li>
					<li><a href="#" data-bs-toggle="modal" data-bs-target="#loadFileDialog"><i
								class="bi bi-upload"></i></a></li>
				</ul>
				<table id="plot" cellpadding="0" cellspacing="0" class="gf-tabel"
					z:classappend="${screenType == 'sl' ? 'dotplot' : 'heatmap'}">
					<tbody>
					</tbody>
					<tfoot>
						<tr class="no-fishtail">
							<td></td>
							<td class="screen-status"></td>
							<td class="label-container"></td>
							<td></td>
						</tr>
					</tfoot>
				</table>
				<!-- <div id="fishtailplot" class="plot-container ft-plot-container" style="display: none"><svg width="100%"
						height="100%" id="ft-plot"></svg></div> -->
			</div>
		</div>
	</div>

	<div class="tooltip"></div>

	<div class="modal fade" id="loadFileDialog" role="dialog" tabindex="-1" aria-labelledby="dialog-label">
		<div class="modal-dialog">
			<div class="modal-content">
				<div class="modal-header">
					<h4 class="modal-title" id="dialog-label">Load gene names from file</h4>
					<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
				</div>

				<div class="modal-body">Select a file containing the gene names you want to display. <input type="file"
						id="localGeneFile" /></div>

				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Insert</button>
				</div>
			</div>
		</div>
	</div>

	<footer z:replace="~{footer :: content}"></footer>

</body>

</html>
