<!DOCTYPE html>

<html xmlns:z="http://www.hekkelman.com/libzeep/m2" lang="en">


<!-- The gene info dialog: -->
<div z:fragment="gene-info-dialog(type)">
	<button class="btn btn-sm btn-secondary show-gene-info-btn" id="show-gene-info-btn">Gene Info</button>

	<div id="gene-info-dialog" style="background-color: white;">
		<div class="container">

			<table class="table table-sm">
				<thead z:switch="${type}">
					<tr z:case="'ip'">
						<th>Gene</th>
						<th>p-value</th>
						<th>high</th>
						<th>low</th>
					</tr>
					<tr z:case="'sl'">
						<th>Gene</th>
						<th>binom</th>
						<th>sense</th>
						<th>antisense</th>
						<th>odds</th>
					</tr>
				</thead>
				<tbody>
				</tbody>
			</table>
		</div>
	</div>
</div>

</html>
